<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" role="img" aria-label="A page in a brain: the summary and sourced facts above the timeline mark, dated evidence below it, each line saying who wrote it and who made the call.">
<title>A page in a brain: the summary and sourced facts above the timeline mark, dated evidence below it, each line saying who wrote it and who made the call.</title>
<style>
svg{--canvas-soft:#0D0B24;--surface-card:#161134;--ink:#EDEAFF;--body:#C2BBEE;--muted:#A9A2DC;--accent:#9C8BF0;--hairline:rgba(180,165,255,.16);--hairline-strong:rgba(180,165,255,.32);--success:#4ADE80;--warn:#FBBF24}
text{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;font-size:15px;fill:var(--body)}
.brand{font-family:'Rubik','IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;font-size:30px;font-weight:600;fill:var(--ink);letter-spacing:-.035em}
.hero{font-size:40px;font-weight:600;fill:var(--ink);letter-spacing:-.01em}
.h{font-size:16px;font-weight:600;fill:var(--ink);letter-spacing:-.01em}
.lead{font-size:17px;fill:var(--body)}
.q{font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;fill:var(--ink)}
.b{font-size:14.5px;fill:var(--body)}
.i{font-size:14.5px;fill:var(--ink)}
.l{font-size:11.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}
.m{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12.5px;fill:var(--muted)}
.mi{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12.5px;fill:var(--ink)}
.mb{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12.5px;fill:var(--ink);font-weight:600}
.ma{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12.5px;fill:var(--accent)}
.card{fill:var(--surface-card);stroke:var(--hairline);stroke-width:1}
.soft{fill:var(--canvas-soft)}
.bar{fill:var(--accent)}
.rule{stroke:var(--hairline);stroke-width:1}
.ok{fill:var(--success)}
.wait{fill:var(--warn)}
</style>
<rect x="1" y="1" width="606" height="398" rx="8" class="card"/>
<text x="21" y="31" class="m">projects/acme/card.md</text>
<line x1="21" y1="44" x2="587" y2="44" class="rule"/>
<text x="21" y="72" class="mb"># acme</text>
<text x="21" y="94" class="mi">Move Acme to the new billing provider before the January audit.</text>
<text x="21" y="126" class="mb">## Now</text>
<text x="21" y="148" class="mi">- UAT with the client's finance team</text>
<text x="21" y="180" class="mb">## Facts</text>
<text x="21" y="202" class="mi">| UAT starts 18 Nov | meeting 2026-11-05 | dana · confirmed |</text>
<line x1="21" y1="226" x2="240" y2="226" class="rule"/>
<text x="252" y="230" class="ma">&lt;!-- timeline --&gt;</text>
<line x1="388" y1="226" x2="587" y2="226" class="rule"/>
<text x="21" y="262" class="mi">- **2026-11-05** | Meeting — UAT moved to 18 Nov</text>
<text x="37" y="283" class="m">[dana · human · confirmed]</text>
<text x="21" y="315" class="mi">- **2026-11-06** | call with Sara — decision: go live in January,</text>
<text x="37" y="336" class="mi">not December: the audit comes first (who: overrode)</text>
<text x="37" y="357" class="m">[dana · agent claude-code · unconfirmed]</text>
<text x="640" y="60" class="l">THE CURRENT TRUTH</text>
<text x="640" y="82" class="b">The summary to act from, and a table</text>
<text x="640" y="103" class="b">of facts. Every fact names its source.</text>
<line x1="640" y1="136" x2="959" y2="136" class="rule"/>
<text x="640" y="166" class="l">THE EVIDENCE</text>
<text x="640" y="188" class="b">Dated lines under the timeline mark.</text>
<text x="640" y="209" class="b">Nothing is deleted or rewritten.</text>
<line x1="640" y1="242" x2="959" y2="242" class="rule"/>
<text x="640" y="272" class="l">WHO MADE THE CALL</text>
<text x="640" y="294" class="b">A decision says if it was yours,</text>
<text x="640" y="315" class="b">Claude's suggestion, or your override.</text>
<line x1="640" y1="348" x2="959" y2="348" class="rule"/>
<text x="640" y="378" class="b">What an agent wrote stays marked.</text>
</svg>
