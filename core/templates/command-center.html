<title>Cogby command center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* The page loads nothing from the network: no font, no script, no image. The families below are used
     when the reader has them installed, and the system's own otherwise.
     Four tabs in one file: today, tasks and notes, projects (with a view of each project), the brain. Tokens
     are Cogby's own (the Console's), one light look in every theme. Coloured text uses the "ink"
     partner of a status colour: the fills are for dots and fail contrast as text. */
  :root{
    --primary:#372476; --ink:#191634;
    --body:#3d3663; --muted:#5c5486; --muted-soft:#736b96;
    --hairline:rgba(55,36,118,.16); --hairline-soft:rgba(55,36,118,.10); --hairline-strong:rgba(55,36,118,.28);
    --canvas:#ffffff; --canvas-soft:#f7f7f5; --surface-card:#ffffff; --surface-strong:#efefed;
    --on-primary:#ffffff; --accent:#5940a4; --seg-on:#e9e3f6;
    --st-needs:#DC7E27; --st-running:#22A96B; --st-scheduled:#9A93BE; --st-accent:#8B3FC4; --st-todo:#A99DDC;
    /* the Console's "ink" partners of the status colours, for text. The fills fail contrast as text. */
    --st-needs-ink:#8A4A14; --st-running-ink:#12704A; --st-accent-ink:#5B2185; --st-scheduled-ink:#4C3A6E;
    --success:#16a34a; --warn:#b45309; --error:#a8386e;
    --shadow:0 4px 16px rgba(25,22,52,.06);
    /* Square-ish on purpose (owner, 2026-11-18: "more rectangular, now everything is very circular"):
       cards, buttons, chips, pills and panels take small corners. Dots and the round tick stay round. */
    --r-sm:4px; --r-lg:6px; --r-xl:8px; --r-pill:6px;
    --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --brand:'Rubik',var(--sans);
  }
  /* One look on purpose: the page is light in every theme. Every colour is set here, none is inherited. */
  :root{color-scheme:light}

  *{box-sizing:border-box}
  html{scroll-padding-top:60px}
  body{margin:0;background:var(--canvas);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding-block:24px 64px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}

  .top{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
  .top svg.mark{width:38px;height:38px;flex:none}
  .top b{font-family:var(--brand);font-weight:500;font-size:26px;letter-spacing:-.018em;color:var(--ink);line-height:1}
  .top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .asof{font-size:12.5px;color:var(--muted);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:4px 11px;background:var(--surface-card);white-space:nowrap}
  /* The answers a file opened from disk cannot send, as text to paste, when the clipboard is closed. */
  #copybox{flex:1 1 100%;min-height:90px;font-family:var(--mono);font-size:12px}

  /* tabs, after the Console's .project-sections (underline, ink when on). Stays in reach while scrolling. */
  .tabsbar{position:sticky;top:0;z-index:5;background:var(--canvas);border-bottom:1px solid var(--hairline);margin-bottom:30px}
  .tabs{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:2px 0 0;border-bottom:2px solid transparent;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap}
  .tabs a:hover{color:var(--ink)}
  .tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
  .count{font-size:11px;font-weight:600;min-width:20px;text-align:center;padding:1px 6px;border-radius:var(--r-pill);background:var(--surface-strong);color:var(--muted);font-variant-numeric:tabular-nums}
  .count.hot{background:color-mix(in srgb, var(--st-needs) 20%, transparent);color:var(--st-needs-ink)}

  h1{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:-.4px;line-height:1.15;color:var(--ink);margin:0;text-wrap:balance}
  h1:focus{outline:none}
  .lede{margin:8px 0 30px;color:var(--muted);font-size:15px}
  .lede a{color:inherit}

  .kicker{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.96px;color:var(--muted);margin:0}
  .sectionhead{display:flex;align-items:baseline;gap:11px;margin:0 2px 10px;flex-wrap:wrap}
  .sectionhead .more{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none}
  .sectionhead .btn{margin-left:auto;align-self:center}
  .soft{color:var(--muted);font-size:12px}
  section{margin-bottom:30px;min-width:0}

  .card{background:var(--surface-card);border:1px solid var(--hairline);border-radius:var(--r-xl);overflow:hidden}
  .row{padding:13px 18px;border-top:1px solid var(--hairline-soft)}
  .row:first-child{border-top:0}
  .row.chosen{background:var(--canvas-soft)}
  .line{display:flex;align-items:center;gap:12px}
  .main{flex:1 1 auto;min-width:0}
  .t{color:var(--ink);font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
  .m{font-size:12px;color:var(--muted-soft);margin-top:1px;overflow-wrap:anywhere}
  .m a,.plink{color:var(--accent);font-weight:600;text-decoration:none}
  .m a:hover,.plink:hover{text-decoration:underline}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .ntag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border:1px solid currentColor;border-radius:4px;padding:1px 5px;flex:none;white-space:nowrap;color:var(--muted)}
  .tag-err{color:var(--error)} .tag-needs{color:var(--st-needs-ink)} .tag-warn{color:var(--warn)} .tag-ok{color:var(--st-running-ink)} .tag-new{color:var(--st-accent-ink);border-style:dashed}
  /* Fix on a timeline line: there when the line is pointed at or reached by keyboard, always on a touch screen. */
  .tl .fix{opacity:0}
  .tl:hover .fix,.tl .fix:focus-visible,.tl .fix.has,.tl .fix[aria-expanded="true"]{opacity:1}
  @media (hover:none){ .tl .fix{opacity:1} }
  .when{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:92px}
  .acts{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
  .failed{color:var(--error);font-size:12px}

  button,input,select,textarea{font-family:var(--sans)}
  .btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink);background:var(--canvas-soft);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:6px 13px;min-height:34px;cursor:pointer;white-space:nowrap;text-decoration:none}
  .btn.accent{background:var(--primary);color:var(--on-primary);border-color:transparent}
  .btn.quiet{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
  .btn.small{min-height:28px;padding:3px 11px;font-size:12.5px;border-radius:var(--r-pill)}
  .btn[aria-pressed="true"]{background:var(--seg-on);border-color:var(--hairline-strong);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:default}
  .bubble{width:34px;height:34px;padding:0;justify-content:center;border-radius:var(--r-lg)}
  .bubble svg{width:15px;height:15px}
  .bubble.has{background:var(--seg-on);border-color:var(--hairline-strong)}
  :where(button, a, textarea, input, select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip{display:inline-flex;align-items:center;font-size:12.5px;color:var(--body);background:var(--canvas);border:1px solid var(--hairline-soft);border-radius:var(--r-pill);padding:4px 12px;min-height:30px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--seg-on);border-color:var(--hairline-strong);color:var(--ink);font-weight:600}
  /* fingers get 44px targets; a mouse keeps the Console's density. */
  @media (pointer:coarse){ .btn,.btn.small{min-height:44px} .bubble{width:44px;height:44px} .chip{min-height:40px;padding-inline:14px} }

  .ask{margin:10px 0 0 20px;display:grid;gap:8px}
  .options{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip.sug::after{content:"suggested";margin-left:7px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
  .note{margin:10px 0 0 20px}
  .noteacts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  textarea,.field{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--canvas-soft);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:9px 12px;min-width:0}
  textarea{min-height:62px;resize:vertical}
  .field{min-height:40px;width:auto}
  ::placeholder{color:var(--muted-soft);opacity:1}

  .empty{background:var(--canvas-soft);border:1.5px dashed var(--hairline-strong);border-radius:var(--r-xl);padding:20px 24px;color:var(--muted);font-size:14px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 2px 12px}
  /* The projects, as the old Console listed them: a search, chips by status, then one row per project with
     its status, its open to-dos and when it last moved; a sub-project sits under the project it is part of. */
  .psearch{width:100%;margin:0 0 12px}
  .plist{padding:4px 8px;container-type:inline-size}
  .pnode + .pnode > .prow{border-top:1px solid var(--hairline-soft)}
  .prow{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 8px 6px 4px;border-radius:var(--r-sm);color:inherit;text-decoration:none}
  .prow:hover{background:var(--canvas-soft)}
  .pnode.sub .prow{padding-left:26px}
  .phead{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .pname{font:500 14px/1.35 var(--sans);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pnode.sub .pname{font-weight:400;font-size:13.5px}
  .psubs{flex:none;font:400 11.5px/1 var(--mono);color:var(--muted-soft);white-space:nowrap}
  .pstat{flex:none;width:104px;display:flex}
  .pmeta{flex:none;display:inline-flex;align-items:center;gap:14px;font:400 12px/1 var(--mono);color:var(--muted-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .popen{color:var(--muted);width:54px;text-align:right}
  .pwhen{width:62px;text-align:right}
  @container (max-width:470px){ .prow{gap:8px;padding:6px 4px} .pnode.sub .prow{padding-left:18px} .pstat{width:auto} .popen,.psubs{display:none} .pwhen{width:auto} }
  /* A status, as the Console drew it: a small pill in capitals, in the status's colour. */
  .spill{--st-c:var(--st-accent);--st-ink:var(--st-accent-ink);display:inline-flex;align-items:center;gap:6px;font:500 9.5px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
    color:var(--st-ink);background:color-mix(in srgb, var(--st-c) 12%, transparent);border:1px solid color-mix(in srgb, var(--st-c) 40%, transparent);border-radius:var(--r-pill);padding:1px 9px}
  .spill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--st-c)}
  .spill.planning{--st-c:var(--st-scheduled);--st-ink:var(--st-scheduled-ink)}
  .spill.on-hold{--st-c:var(--st-needs);--st-ink:var(--st-needs-ink)}
  .spill.done{--st-c:var(--st-running);--st-ink:var(--st-running-ink)}
  .spill.other{--st-c:var(--muted-soft);--st-ink:var(--muted);border-style:dashed}
  .cdot{flex:none;width:7px;height:7px;border-radius:50%;margin-right:6px}
  /* A project's page: the Console's header (status, open tasks, when it moved) and its tabs. */
  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
  .crumb a{color:var(--muted);font-weight:600;text-decoration:none}
  .crumb a:hover{color:var(--ink)}
  .pfacts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .opentag{font:500 9.5px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--surface-strong);border-radius:var(--r-pill);padding:1px 9px;white-space:nowrap}
  .ptruth{margin:12px 0 0;max-width:72ch;color:var(--body)}
  .ptabs{display:flex;gap:22px;border-bottom:1px solid var(--hairline);margin:22px 0;overflow-x:auto;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ptabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;min-height:40px;font:600 13.5px var(--sans);color:var(--muted);cursor:pointer}
  .ptabs button:hover{color:var(--ink)}
  .ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .narrow{max-width:760px}
  .docrow{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .docpath{flex:1 1 220px;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
  .docmeta{flex:none;font:400 12px var(--mono);color:var(--muted-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
  /* The Tasks view, as the old Console drew it: a switch (All, Mine, Cogby's) and + New task, then lanes
     headed by a state pill, thin rows with a round tick, the words, and the due date at the right. */
  .tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 4px}
  .tbar .chip{margin-left:auto}
  .seg{display:inline-flex;background:var(--surface-strong);border-radius:var(--r-lg);padding:3px}
  .seg button{border:0;background:transparent;cursor:pointer;font:600 13px var(--sans);color:var(--muted);padding:7px 15px;min-height:34px;border-radius:var(--r-sm)}
  .seg button[aria-pressed="true"]{background:var(--surface-card);color:var(--ink);box-shadow:var(--shadow)}
  .tghead{display:flex;align-items:center;gap:8px;margin:20px 4px 4px;color:var(--muted);font:600 10.5px/1.4 var(--sans);letter-spacing:.9px;text-transform:uppercase}
  .tgcount{color:var(--muted-soft);font-weight:500}
  .statepill{--sp:var(--st-todo);--sp-ink:var(--st-scheduled-ink);display:inline-flex;align-items:center;gap:7px;flex:none;padding:5px 11px;color:var(--sp);
    border-radius:var(--r-pill);border:1px solid color-mix(in srgb, var(--sp) 44%, transparent);background:color-mix(in srgb, var(--sp) 14%, transparent)}
  .statepill svg{width:13px;height:13px;flex:none}
  .statepill .splbl{font:500 9px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sp-ink);white-space:nowrap}
  .statepill.sp-running,.statepill.sp-done{--sp:var(--st-running);--sp-ink:var(--st-running-ink)}
  .trow{position:relative;display:flex;align-items:center;gap:12px;padding:11px 8px;border-top:1px solid var(--hairline-soft);border-radius:var(--r-sm)}
  .trow:hover{background:var(--canvas-soft)}
  .tcheck{position:relative;z-index:1;flex:none;width:18px;height:18px;padding:0;border-radius:50%;border:1.5px solid var(--hairline-strong);background:var(--surface-card);cursor:pointer;display:grid;place-items:center}
  .tcheck::before{content:"";position:absolute;inset:-13px}
  .tcheck::after{content:"";width:4px;height:8px;border:solid transparent;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
  .tcheck:hover{border-color:var(--success)}
  .tcheck:hover::after{border-color:color-mix(in srgb, var(--success) 55%, transparent)}
  .tcheck.done{background:var(--success);border-color:var(--success)}
  .tcheck.done::after{border-color:var(--on-primary)}
  .tname{flex:1;min-width:0;margin:0;padding:0;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .tname::after{content:"";position:absolute;inset:0}
  .tdone .tname{color:var(--muted-soft);text-decoration:line-through}
  .trow .ntag,.tpull,.tdue,.tdueadd,.tat,.tduein{position:relative;z-index:1}
  .tdue,.tdueadd,.tat{flex:none;min-width:48px;margin:0;padding:0;border:0;background:none;font:inherit;font-size:12.5px;text-align:right;color:var(--muted-soft);font-variant-numeric:tabular-nums;cursor:pointer}
  .tdue.over{color:var(--warn)}
  .tat{cursor:default}
  .tdueadd,.tpull{font-size:12px;color:transparent}
  .trow:hover .tdueadd,.trow:focus-within .tdueadd,.trow:hover .tpull,.trow:focus-within .tpull{color:var(--muted-soft)}
  @media (pointer:coarse){ .tdueadd,.tpull{color:var(--muted-soft)} }
  .tpull{flex:none;margin:0;padding:0 2px;border:0;background:none;font-family:inherit;cursor:pointer}
  .tduein{flex:none;font:inherit;font-size:12px;color:var(--ink);background:var(--surface-card);border:1px solid var(--hairline-strong);border-radius:var(--r-sm);padding:2px 6px}
  .tplanned{position:relative;display:flex;align-items:center;gap:11px;padding:12px 8px;border-top:1px solid var(--hairline-soft);border-radius:var(--r-sm)}
  .tplanned:hover{background:var(--canvas-soft)}
  .tfold{flex:1;min-width:0;display:flex;align-items:center;gap:11px;margin:0;padding:0;border:0;background:none;font:600 14.5px var(--sans);color:var(--ink);text-align:left;cursor:pointer}
  .tfold::after{content:"";position:absolute;inset:0}
  .tfold .car{flex:none;width:10px;font-size:10px;color:var(--muted-soft);transition:transform .12s}
  .tfold[aria-expanded="true"] .car{transform:rotate(90deg)}
  .tfold .slug{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tpcount{flex:none;font:400 11.5px var(--mono);color:var(--muted-soft)}
  .topen{position:relative;z-index:1;flex:none;min-width:48px;text-align:right;font-size:12px;color:var(--muted-soft);text-decoration:none}
  .topen:hover{color:var(--ink)}
  .tkids{padding-left:24px;margin-left:14px;border-left:1px solid var(--hairline-soft)}
  .tempty{margin-top:20px}
  .tempty b{color:var(--ink)}
  /* Today's tasks, as the Console's Home had them. */
  .tcard{padding:2px 10px}
  .tcard > .trow:first-child{border-top:0}
  .tadd{padding:7px 8px;border-top:1px solid var(--hairline-soft)}
  /* The New task window, after the Console's. */
  .newtask{width:min(620px, calc(100vw - 32px))}
  .nthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .nthead h2{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.2px;color:var(--ink);margin:0 auto 0 0}
  .newtask form{display:grid;gap:12px;margin-top:14px}
  .newtask textarea,.newtask .field{width:100%}
  .ntwhat{min-height:96px;font-size:15px}
  .ntmore{justify-self:start;margin:0;padding:0;border:0;background:none;font:600 13px var(--sans);color:var(--muted);cursor:pointer}
  .ntrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ntlbl{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
  .ntfoot{display:flex;justify-content:flex-end;gap:8px}
  @media (max-width:560px){ .ntrow{grid-template-columns:1fr} }
  .badges{display:flex;gap:8px;flex-wrap:wrap}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:11px 18px;border-bottom:1px solid var(--hairline-soft)}
  td{padding:11px 18px;border-top:1px solid var(--hairline-soft);vertical-align:top}
  tbody tr:first-child td{border-top:0}
  td.path,.path{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
  td b{color:var(--ink);font-weight:600}
  td .ntag{margin-left:8px;vertical-align:1px}
  /* A mounted folder that is not there any more stands out. */
  tr.miss{background:color-mix(in srgb, var(--error) 7%, transparent)}
  tr.miss td.files{color:var(--error);font-weight:600}
  .srcnote{margin:10px 2px 0}

  code{font-family:var(--mono);font-size:12px;background:var(--surface-strong);border-radius:4px;padding:1px 5px}

  /* two columns on a wide screen; on a phone the columns dissolve and sections follow .o1 … .o6. */
  .cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .col{min-width:0}
  @media (max-width:900px){
    .cols{grid-template-columns:minmax(0,1fr)} .col{display:contents}
    .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}
  }

  /* The owner's own to-dos and notes: the Console's round tick, its group heads, its note cards and its
     add field, a plain line at the top of the list that grows a project and a day once you are in it. */
  .check{flex:none;width:44px;height:44px;margin:-11px -8px -11px -12px;display:grid;place-items:center;background:none;border:0;border-radius:50%;cursor:pointer}

    // The owner's own folders first, a missing one at the top; the brain itself and its day log last.
    var builtIn = function (s) { return s.builtin || s.id === 'brain' || s.id === 'log'; };
    var mine = sources.filter(function (s) { return !builtIn(s); }).sort(function (a, b) { return (b.missing ? 1 : 0) - (a.missing ? 1 : 0) || (String(a.name || a.id) < String(b.name || b.id) ? -1 : 1); });
    var ordered = mine.concat(sources.filter(builtIn));
    var missing = sources.filter(function (s) { return s.missing; }).length;
    var src = section(0, 'Sources · ' + sources.length, missing ? missing + ' missing' : '');
    if (!sources.length) src.appendChild(el('div', 'empty', 'No folder is mounted.'));
    else {
      var table = el('table'); var tr = el('tr');
      // A published page carries no folder paths: the column is there only when a path is.
      var paths = sources.some(function (s) { return s.path; });
      ['Name'].concat(paths ? ['Folder'] : [], ['Access', 'Files', 'Last read']).forEach(function (h) { tr.appendChild(el('th', null, h)); });
      table.appendChild(put(el('thead'), tr));
      var body = el('tbody');
      var cell = function (label, text, cls) { var td = el('td', cls, text); td.dataset.l = label; return td; };
      ordered.forEach(function (s) {
        var label = s.id === 'brain' ? 'This brain' : s.id === 'log' ? 'Day log' : (s.name || s.id);
        var name = put(el('td'), el('b', null, label), builtIn(s) ? tag('built in') : null, s.missing ? tag('missing', 'tag-err') : null);
        body.appendChild(put(el('tr', s.missing ? 'miss' : null), name, paths ? el('td', 'path', s.path) : null, cell('Access', s.mode === 'write' ? 'read and write' : 'read only'),
          cell('Files', s.missing ? 'folder missing' : String(s.files), 'files'), cell('Last read', s.last_sync ? String(s.last_sync).slice(0, 16).replace('T', ' ') : 'never')));
      });
      src.appendChild(put(el('div', 'card'), put(table, body)));
      if (!mine.length) src.appendChild(el('p', 'soft srcnote', 'No folder of yours is mounted. Ask Cogby to add one as a source, and it is read with the brain.'));
      else if (missing) src.appendChild(el('p', 'soft srcnote', 'A missing folder was moved or renamed. Ask Cogby to mount it again or to remove it.'));
    }
    view.appendChild(src);

    view.appendChild(put(section(0, 'Latest in your brain'),
      recent.length ? card(timelineRows(recent, true)) : el('div', 'empty', 'Nothing written yet.')));
  };

  // ---- tabs, header, what has not left the page ----
  function route() {
    if (only) return { name: 'project', arg: only.name };
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    var name = views[parts[0]] ? parts[0] : 'today'; var arg = '';
    try { arg = decodeURIComponent(parts.slice(1).join('/')); } catch (e) { arg = ''; }
    return { name: name, arg: arg };
  }
  function chrome(r) {
    var tabs = $('tabs'); tabs.textContent = ''; tabs.parentNode.hidden = !!only;
    var missing = sources.filter(function (s) { return s.missing; }).length;
    [['today', 'Today', needsCount(), true], ['todos', 'Tasks & notes', dueTodos().length, true], ['projects', 'Projects', projects.length, false], ['brain', 'Brain', missing, true]].forEach(function (t) {
      var a = link('#/' + t[0], null, t[1]);
      if (r.name === t[0] || (t[0] === 'projects' && r.name === 'project') || (t[0] === 'todos' && r.name === 'notes')) a.setAttribute('aria-current', 'page');
      if (t[2]) a.appendChild(el('span', 'count' + (t[3] ? ' hot' : ''), String(t[2])));
      tabs.appendChild(a);
    });
    $('asof').textContent = when ? 'As of ' + when : 'Snapshot';
  }
  // What cannot leave on its own: everything chosen on a file opened from disk, and what the store refused.
  function loose() {
    var n = unsaved().filter(function (c) { return !c.sending; }).length;
    Object.keys(pending.actions).forEach(function (k) { if (!db || pending.actions[k].failed) n++; });
    Object.keys(pending.comments).forEach(function (k) { if (!db || pending.comments[k].failed) n++; });
    return n;
  }
  // The header says what left the page and is not in the brain yet, and offers Copy only while something
  // cannot leave on its own.
  function header() {
    var out = Object.keys(pending.sent).length + Object.keys(pending.sentComments).length + pending.changes.length;
    $('outbox').hidden = !out; $('outbox').textContent = out + ' sent'; $('outbox').title = LATER;
    var copy = $('copy'); var n = loose();
    copy.hidden = !n && !said; copy.textContent = said || 'Copy my answers';
    copy.title = n ? plural(n, 'thing') + ' to paste to Claude: this page cannot send ' + (n === 1 ? 'it' : 'them') + ' on its own' : '';
  }
  function render(moved) {
    var r = route(); var view = $('view');
    var active = document.activeElement; var fk = active && active.dataset ? active.dataset.fk : '';
    view.textContent = '';
    views[r.name](view, r.arg);
    chrome(r); header(); keep(); drawMeeting(); drawNote(); drawTask();
    var p = r.name === 'project' ? byName(r.arg) : null;
    document.title = only ? only.title + ' dashboard' : (p ? p.title + ' · ' : '') + 'Cogby command center';
    if (moved) { window.scrollTo(0, 0); var h = view.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
    else if (fk) { var all = view.querySelectorAll('[data-fk]'); for (var i = 0; i < all.length; i++) if (all[i].dataset.fk === fk) { all[i].focus({ preventScroll: true }); break; } }
  }

  // What Copy carries: what was chosen and not sent, the comments, and the changes to the lists not saved.
  function asText() {
    var lines = ['From my Cogby command center (the page made ' + (when || 'earlier') + '). Apply these:'];
    Object.keys(pending.actions).forEach(function (k) {
      var a = pending.actions[k];
      lines.push('- ' + (a.kind === 'answer' ? 'answer "' + a.option + '" on' : a.kind === 'dismiss' ? 'clear' : a.kind === 'later' ? 'put off' : 'prepare me for') + ' ' + a.id + ' (' + a.label + ')');
    });
    Object.keys(pending.comments).forEach(function (k) {
      var c = pending.comments[k];
      if (c.kind === 'line') lines.push('- fix the line of ' + ((c.extra && c.extra.date) || '') + ' on ' + c.id + ' ("' + c.label + '"): ' + c.text);
      else lines.push('- my comment on ' + c.kind + ' ' + c.id + ' (' + c.label + '): ' + c.text);
    });
    unsaved().forEach(function (c) {
      if (c.kind === 'todo-add') lines.push('- add to-do: ' + c.text + (c.project ? ' (project ' + c.project + ')' : '') + (c.due ? ' (due ' + c.due + ')' : '') + (c.body ? ' (details: ' + c.body + ')' : ''));
      else if (c.kind === 'todo-edit') lines.push('- edit to-do ' + (c.id || c.client_id) + ':' + [c.text ? ' text "' + c.text + '"' : '', c.due ? ' due ' + c.due : '', c.project ? ' project ' + c.project : '', c.body ? ' details "' + c.body + '"' : ''].filter(Boolean).join(';'));
      else if (c.kind === 'note-add') lines.push('- note' + (c.project ? ' on ' + c.project : '') + ': ' + c.text + (c.body ? ' (more: ' + c.body + ')' : ''));
      else if (c.id && c.kind === 'note-dismiss') lines.push('- remove note ' + c.id);
      else if (c.id) lines.push('- ' + (c.kind === 'todo-done' ? 'tick' : c.kind === 'todo-drop' ? 'remove' : 'reopen') + ' to-do ' + c.id);
    });
    return lines.join('\n');
  }
  $('copy').addEventListener('click', function () {
    var text = asText(); var box = $('copybox');
    var shown = function () { box.hidden = false; box.value = text; box.focus(); box.select(); };
    try { navigator.clipboard.writeText(text).then(function () { said = 'Copied. Paste it to Claude.'; box.hidden = true; header(); }, shown); } catch (e) { shown(); }
  });

  window.addEventListener('hashchange', function () {
    said = ''; openMeeting = null; shownNote = null; shownTask = null; taskDraft = null;
    if (meetBox) { var d = meetBox; meetBox = null; gone(d); }
    if (noteBox) { var n = noteBox; noteBox = null; gone(n); }
    if (taskBox) { var k = taskBox; taskBox = null; gone(k); }
    render(true);
  });
  render();
  // The store is there only on the published page; a file opened from disk keeps Copy alone.
  if (window.claude && typeof window.claude.use === 'function') {
    Promise.resolve().then(function () { return window.claude.use('db'); }).then(function (store) { db = store || null; flush(); sendOut(); render(); }, function () { db = null; render(); });
  }
})();
</script>
